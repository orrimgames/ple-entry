# Local-dev proxy: serves the sponsored model NAMES, backed by free endpoints.
# Iteration runs use openai-compatible NIM models; final artifact runs must map
# the declared model to a real endpoint serving THAT model (AI Studio key or Vertex).
model_list:
  - model_name: gemini-3.1-pro-preview
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY
  - model_name: nim-deepseek
    litellm_params:
      model: openai/deepseek-ai/deepseek-v4.1-flash
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
  - model_name: nim-kimi
    litellm_params:
      model: openai/moonshotai/kimi-k2.6
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
  - model_name: nim-glm
    litellm_params:
      model: openai/z-ai/glm-5.3-flash
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
general_settings:
  master_key: os.environ/MODEL_PROXY_KEY
